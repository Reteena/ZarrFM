[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zarrfm"
description = "Zarr stores for EEG recordings and ML-ready corpora: signals, channels, canonical montage, events, splits, provenance"
requires-python = ">=3.11"
keywords = ["eeg", "zarr", "neuroscience", "electrophysiology", "file-format", "chunked-array"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dynamic = ["version"]

dependencies = [
    "zarr>=3.0",
    "numpy>=1.24",
    "numcodecs>=0.13",
]

[project.optional-dependencies]
mne = ["mne"]
edf = ["edfio>=0.4"]
torch = ["torch>=2.0"]
dev = ["pytest>=7", "mne>=1.6", "edfio>=0.4", "h5py>=3.8"]

[tool.setuptools]
packages = ["zarrfm"]

[tool.setuptools.dynamic]
version = { attr = "zarrfm.spec.VERSION" }
